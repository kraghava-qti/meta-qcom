#@TYPE: Machine
#@NAME: Qualcomm QCS9100 Ride SX Beta Evaluation Kit (EVK)
#@DESCRIPTION: Machine configuration for Qualcomm QCS9100 Ride SX Beta Evaluation Kit (EVK)

require conf/machine/include/shikra.inc

MACHINE_FEATURES += "efi pci"

QCOM_DTB_DEFAULT ?= "shikra-iqs-evk"

KERNEL_DEVICETREE ?= " \
                       qcom/shikra-cqm-evk.dtb \
                       qcom/shikra-cqs-evk.dtb \
                       qcom/shikra-iqs-evk.dtb \
                      "

# These DTs are not upstreamed and currently exist only in linux-qcom kernels
LINUX_QCOM_KERNEL_DEVICETREE ?= " \
                      "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
"

QCOM_CDT_FILE = ""
QCOM_BOOT_FILES_SUBDIR = "shikra"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/shikra/emmc"

QCOM_BOOT_FIRMWARE = ""

ABL_SIGNATURE_VERSION ?= "v6"

# Isolate rt cpu
QCOM_RT_CPU        = "7"
QCOM_IRQAFF        = "0-6"
QCOM_RCU_NOCBS     = "7"
QCOM_RCU_EXPEDITED = "1"
QCOM_CPUIDLE_OFF   = "1"
